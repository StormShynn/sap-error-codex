name: Add a new issue
description: Report a deployment issue not yet in the repository
title: "[Bug] "
labels: ["new-issue"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real hostnames, tenant IDs, usernames, or transport numbers here.
        Use placeholders instead: `<host>`, `<appname>`, `<TRANSPORT>`.

  - type: input
    id: title
    attributes:
      label: Symptom
      description: One sentence describing exactly what the user sees
      placeholder: Deploy fails with 400 at the Application Index step even though the package is correct
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Area
      options:
        - SAP Fiori / UI5
        - ABAP / Extensibility
        - Transport & Release
        - Integration / OData
        - Power BI
        - Microsoft Fabric
        - Basis / Auth
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: msgkeys
    attributes:
      label: Message ID / error code
      description: Comma-separated. This is what people will search for later.
      placeholder: /UI2/UI5_REP_LOAD-039, HTTP 400
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: Log
      description: Paste the decisive log line verbatim, don't paraphrase it
      render: text
    validations:
      required: true

  - type: textarea
    id: rootcause
    attributes:
      label: Root cause
      description: If unsure, write "Not verified. Possibly: ..."

  - type: textarea
    id: solution
    attributes:
      label: Fix
      description: Concrete steps, with commands or transaction paths. State the cost too.

  - type: checkboxes
    id: verified
    attributes:
      label: Verification
      options:
        - label: I ran this fix on a real system and it worked
