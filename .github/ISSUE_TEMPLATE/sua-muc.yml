name: Fix or verify an existing entry
description: Add to, correct, or confirm a fix that has already been run
title: "[Fix] "
labels: ["amendment"]
body:
  - type: input
    id: issue_id
    attributes:
      label: Entry ID
      description: The filename in issues/, without the .json extension
      placeholder: ladi-package-conflict
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Contribution type
      options:
        - Verification — I ran it and it worked
        - Counter-evidence — I ran it and it did NOT work
        - New fix
        - Correction of wrong content
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Detail
      description: |
        For verification: date, environment (DEV/QA/PRD), system version.
        For counter-evidence: what conditions made it fail, with logs attached.
      render: text
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Reminder: do not paste real hostnames, tenant IDs, usernames, or transport numbers.
